name: Deploy

on:
  push:
    branches: [develop_tchap]   # -> staging, automatique
    tags: ['v*']          # -> prod, avec approbation (environment)
  workflow_dispatch:
    inputs:
      target:
        description: Environnement a deployer
        required: true
        default: staging
        type: choice
        options: [staging, prod]

# ATTENTION : ces jobs tournent sur le runner self-hosted, DANS le LAN.
# Ils ne doivent jamais etre declenches par une PR venant d'un fork.
permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/develop_tchap' || inputs.target == 'staging'
    runs-on: [self-hosted, linux, x64]
    environment:
      name: staging
      url: https://hack-staging.duckdns.org
    steps:
      - uses: actions/checkout@v4
      - name: Deployer sur hack42-01
        run: ./deploy/deploy.sh staging "${{ github.sha }}"

  prod:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'prod'
    runs-on: [self-hosted, linux, x64]
    environment:
      # Mets un "required reviewer" sur cet environment dans les settings
      # du depot : c'est ce qui empeche un deploiement prod accidentel
      # pendant la demo.
      name: prod
      url: https://hack-prod.duckdns.org
    steps:
      - uses: actions/checkout@v4
      - name: Deployer sur hack42-01
        run: ./deploy/deploy.sh prod "${{ github.sha }}"
