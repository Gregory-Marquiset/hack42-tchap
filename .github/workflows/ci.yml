name: CI

on:
  push:
    branches: [develop_tchap]
  pull_request:

# Jamais pull_request_target ici : ce workflow tourne sur les runners publics
# GitHub, et il ne doit JAMAIS atterrir sur le runner self-hosted (cf. README).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO le jour ou l app existe, remplacer ce bloc par le vrai
      # lint + tests (Node/pnpm ou Python/Django selon la stack retenue).
      - name: Placeholder
        run: echo "pas encore de tests - l app n existe pas"

  image:
    # On ne publie une image que sur develop_tchap : les PR sont juste testees.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Le build bind-monte .git et estampille la version avec git describe :
          # un clone superficiel le ferait echouer.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Le Dockerfile est fourni par le depot ; le contexte doit etre la
          # racine du monorepo, et .git doit rester dedans (le build le
          # bind-monte pour estampiller la version).
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
